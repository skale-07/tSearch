# Prestigious pre-college awards, scholarships, and programs.
#
# Reference data only — no PII, safe to track. Three consumers:
#   1. Seeding      — public winner rosters become named seeds (nomination only).
#   2. Stage        — a dated award with a known cohort stage implies an age band.
#   3. Evidence     — a LinkedIn award string matching an entry here stops being
#                     unverifiable self-report and becomes externally anchored.
#
# `winners_per_year` is APPROXIMATE and unverified — it exists to rank
# selectivity, not to be quoted. Correct freely.
#
# cohort_stage: hs_senior | hs_any | undergrad | young_any
#   drives age derivation; `hs_senior` is the strongest signal (award year ≈ age 18).
# prestige_tier: 1 (exceptional) | 2 (strong) | 3 (notable)
# domain_bias: research | building | general
# roster_public: whether a named winner list is published (drives seeding)

registry_version: 1.0.0
